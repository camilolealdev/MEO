name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Valores dummy solo para que el build no falle por envs ausentes.
          # No se conecta a servicios reales durante el build.
          AUTH_SECRET: ci-dummy-secret-please-override-in-runtime
          NEXT_PUBLIC_SITE_URL: https://example.com
